<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeu</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="game-area" aria-label="Zone de jeu">
        <div class="game-board" role="presentation"></div>
      </section>
      <aside class="stats" aria-label="Statistiques">
        <h2>Statistiques</h2>
        <div class="score-panel" aria-live="polite">
          <div class="score-item">
            <span>Distance</span>
            <strong id="distance-value">0 m</strong>
          </div>
          <div class="score-item">
            <span>Statut de réception</span>
            <strong id="reception-status">En attente</strong>
          </div>
          <div class="score-item">
            <span>Timing</span>
            <strong id="timing-value">—</strong>
          </div>
        </div>
        <p class="status-message" id="status-message">Prêt à jouer.</p>
        <div class="button-group">
          <button type="button" class="start-button">Démarrer</button>
          <button type="button" class="restart-button">Recommencer</button>
        </div>
      </aside>
    </main>

    <script src="game.js"></script>
  </body>
</html>
